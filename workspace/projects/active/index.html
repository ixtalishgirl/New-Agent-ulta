<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halye ka To-Do List</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #000000; color: #ffffff; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-8" class="bg-[#000000] text-zinc-100 min-h-screen">
    <div class="w-full max-w-xl bg-gray-900 p-6 rounded-lg shadow-lg">
        <h1 class="text-2xl font-bold text-center mb-4">Halye ka To-Do List</h1>
        <form id="todo-form" class="flex mb-4">
            <input type="text"
                   id="todo-input"
                   class="flex-1 px-4 py-2 bg-gray-800 border border-gray-700 rounded-l text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500"
                   placeholder="Naya task add karein..."
                   required>
            <button type="submit"
                    class="px-4 py-2 bg-blue-600 text-white rounded-r hover:bg-blue-700 transition">
                Add
            </button>
        </form>
        <ul id="todo-list" class="space-y-2"></ul>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('todo-form');
            const input = document.getElementById('todo-input');
            const list = document.getElementById('todo-list');

            form.addEventListener('submit', e => {
                e.preventDefault();
                const text = input.value.trim();
                if (!text) return;

                const li = document.createElement('li');
                li.className = 'flex items-center justify-between p-3 bg-gray-800 rounded hover:bg-gray-700 transition';

                const span = document.createElement('span');
                span.textContent = text;
                span.className = 'flex-1';

                const btnDiv = document.createElement('div');
                btnDiv.className = 'flex space-x-2';

                const completeBtn = document.createElement('button');
                completeBtn.textContent = 'Complete';
                completeBtn.className = 'px-3 py-1 bg-green-600 text-white rounded hover:bg-green-700 transition';
                completeBtn.onclick = () => {
                    span.classToggle = span.classList.toggle('line-through');
                    span.classList.toggle('line-through');
                };

                const deleteBtn = document.createElement('button');
                deleteBtn.textContent = 'Delete';
                deleteBtn.className = 'px-3 py-1 bg-red-600 text-white rounded hover:bg-red-700 transition';
                deleteBtn.onclick = () => li.remove();

                btnDiv.append(completeBtn, deleteBtn);
                li.append(span, btnDiv);
                list.appendChild(li);
                input.value = '';
                input.focus();
            });
        });
    </script>
</body>
</html>
