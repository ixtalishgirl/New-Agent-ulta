kind = "web"
previewPath = "/"
title = "Haley's AI Agent"
version = "1.0.0"
id = "artifacts/ai-agent"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23886

[services.development]
run = "pnpm --filter @workspace/ai-agent run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ai-agent", "run", "build" ]
serve = "static"
publicDir = "artifacts/ai-agent/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23886"
BASE_PATH = "/"
